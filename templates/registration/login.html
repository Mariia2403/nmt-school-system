{% extends "base.html" %}

{% block title %}Вхід — Школа НМТ{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-sm-10 col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 text-center mb-1"><i class="bi bi-mortarboard-fill text-primary"></i> Школа НМТ</h1>
        <p class="text-center text-muted mb-4">Вхід до інформаційної системи</p>

        {% if form.errors %}
          <div class="alert alert-danger py-2">Неправильний логін або пароль.</div>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label for="id_username" class="form-label">Логін</label>
            <input type="text" name="username" id="id_username" class="form-control"
                   value="{{ form.username.value|default:'' }}" required autofocus>
          </div>
          <div class="mb-3">
            <label for="id_password" class="form-label">Пароль</label>
            <input type="password" name="password" id="id_password" class="form-control" required>
          </div>
          <!-- After login go back to the page the user wanted to open -->
          <input type="hidden" name="next" value="{{ next }}">
          <button type="submit" class="btn btn-primary w-100">Увійти</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
